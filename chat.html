<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Chat</title>
<style>
:root{--ac:#1f7bff;--ac2:#14c4a8;--bg:#f4f7ff;--card:#fff;--tx:#0a1a3f;--mu:#5b6b94;--bd:#dbe4fb;--me:#1f7bff;--ag:#e9eefb}
@media(prefers-color-scheme:dark){:root{--bg:#030a1f;--card:#071a45;--tx:#f1f5ff;--mu:#9db4e6;--bd:#173070;--me:#1f7bff;--ag:#10285f}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--tx);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0)}
header{display:flex;align-items:center;gap:12px;padding:14px 16px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;flex:none}
header .av{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;flex:none}
header .av svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
header b{display:block;font-size:16px;line-height:1.2}
header small{opacity:.85;font-size:12px}
#msgs{flex:1;overflow-y:auto;padding:14px 14px 6px;display:flex;flex-direction:column;gap:8px;-webkit-overflow-scrolling:touch}
.m{max-width:82%;padding:9px 12px;border-radius:16px;font-size:15px;line-height:1.4;white-space:pre-wrap;overflow-wrap:anywhere}
.m small{display:block;opacity:.65;font-size:11px;margin-top:3px}
.m.ag{align-self:flex-start;background:var(--ag);border-bottom-left-radius:5px}
.m.me{align-self:flex-end;background:var(--me);color:#fff;border-bottom-right-radius:5px}
[dir=rtl] .m.ag{border-bottom-left-radius:16px;border-bottom-right-radius:5px}
[dir=rtl] .m.me{border-bottom-right-radius:16px;border-bottom-left-radius:5px}
#err{min-height:18px;padding:0 16px;font-size:13px;color:#e5484d}
#nm{display:none;margin:0 12px 6px;padding:10px 12px;border:1.5px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);font:inherit;font-size:14px}
#nm.on{display:block}
form{display:flex;align-items:flex-end;gap:8px;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0));background:var(--card);border-top:1px solid var(--bd);flex:none}
#tx{flex:1;resize:none;max-height:120px;min-height:42px;padding:10px 12px;border:1.5px solid var(--bd);border-radius:14px;background:var(--bg);color:var(--tx);font:inherit;font-size:15px;line-height:1.35}
#tx:focus,#nm:focus{outline:2px solid var(--ac);outline-offset:0;border-color:transparent}
#go{flex:none;width:42px;height:42px;border:0;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;cursor:pointer}
#go:disabled{opacity:.45;cursor:default}
#go svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
[dir=rtl] #go svg{transform:scaleX(-1)}
footer{font-size:11px;color:var(--mu);text-align:center;padding:0 12px calc(8px + env(safe-area-inset-bottom,0));background:var(--card)}
footer a{color:inherit}
#dead{display:none;flex:1;align-items:center;justify-content:center;text-align:center;padding:30px;color:var(--mu);font-size:15px}
body.off #dead{display:flex}body.off #msgs,body.off form,body.off #err,body.off #nm{display:none}
</style>
</head>
<body>
<header>
  <div class="av"><svg viewBox="0 0 24 24"><path d="M5 5h14a2 2 0 012 2v8a2 2 0 01-2 2h-7l-4.5 3.5V17H5a2 2 0 01-2-2V7a2 2 0 012-2z"/><path d="M8 10h8M8 13h5"/></svg></div>
  <div><b id="ttl">Chat</b><small id="sub"></small></div>
</header>
<div id="msgs" role="log" aria-live="polite"></div>
<div id="dead"></div>
<div id="err" role="alert"></div>
<input id="nm" maxlength="60" autocomplete="name">
<form id="f">
  <textarea id="tx" rows="1" maxlength="2000"></textarea>
  <button id="go" type="submit"><svg viewBox="0 0 24 24"><path d="M3 11.5L21 3l-8.5 18-2.2-7.3z"/></svg></button>
</form>
<footer><span id="pv"></span> <a id="lk" href="legal.html" target="_blank" rel="noopener"></a></footer>
<script>
(function(){
var SB_URL='https://lyykydpgabevqtodlwoq.supabase.co',SB_KEY='sb_publishable_JDG1j8DEyplF3jwqM-2MPg_yPbGynl8';
var T={
fr:{ph:'Écrivez votre message…',send:'Envoyer',nm:'Votre nom (facultatif)',sub:'Nous répondons dès que possible',bad:'Lien de chat invalide.',off:'Ce chat est indisponible pour le moment.',rate:'Trop de messages. Patientez un instant.',fail:'Envoi impossible. Réessayez.',pv:'Vos messages sont transmis à l’entreprise propriétaire de ce chat.',pl:'Confidentialité'},
en:{ph:'Type your message…',send:'Send',nm:'Your name (optional)',sub:'We reply as soon as possible',bad:'Invalid chat link.',off:'This chat is currently unavailable.',rate:'Too many messages. Please wait a moment.',fail:'Could not send. Please try again.',pv:'Your messages are sent to the company that owns this chat.',pl:'Privacy'},
ar:{ph:'اكتب رسالتك…',send:'إرسال',nm:'اسمك (اختياري)',sub:'نرد في أقرب وقت ممكن',bad:'رابط الدردشة غير صالح.',off:'هذه الدردشة غير متاحة حاليًا.',rate:'رسائل كثيرة. انتظر قليلًا.',fail:'تعذّر الإرسال. أعد المحاولة.',pv:'تُرسل رسائلك إلى الشركة المالكة لهذه الدردشة.',pl:'الخصوصية'}
};
var q=new URLSearchParams(location.search),W=(q.get('w')||'').toLowerCase();
var L=(q.get('lang')||navigator.language||'fr').slice(0,2).toLowerCase();if(!T[L])L=(L==='fr'?'fr':'en');
var t=T[L],$=function(i){return document.getElementById(i)};
document.documentElement.lang=L;document.documentElement.dir=L==='ar'?'rtl':'ltr';
$('tx').placeholder=t.ph;$('go').setAttribute('aria-label',t.send);$('nm').placeholder=t.nm;$('nm').setAttribute('aria-label',t.nm);
$('sub').textContent=t.sub;$('pv').textContent=t.pv;$('lk').textContent=t.pl;

function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){}return null}
function rid(){var a=new Uint8Array(16);crypto.getRandomValues(a);return Array.prototype.map.call(a,function(x){return('0'+x.toString(16)).slice(-2)}).join('')}
var SID=ls('pcs_'+W);if(!/^[0-9a-f]{32}$/.test(SID||'')){SID=rid();ls('pcs_'+W,SID)}
var last=0,busy=false,shown={},timer=null;

function rpc(fn,args){return fetch(SB_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:{'Content-Type':'application/json','apikey':SB_KEY},body:JSON.stringify(args)})
.then(function(r){return r.json().then(function(j){if(!r.ok){var e=new Error((j&&(j.message||j.hint))||'error');throw e}return j})})}
function off(msg){document.body.classList.add('off');$('dead').textContent=msg;if(timer)clearTimeout(timer)}
function hm(s){try{var d=new Date(s);return('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}catch(e){return''}}
function add(cls,text,time){var d=document.createElement('div');d.className='m '+cls;d.appendChild(document.createTextNode(text));if(time){var s=document.createElement('small');s.textContent=time;d.appendChild(s)}
var box=$('msgs'),near=box.scrollHeight-box.scrollTop-box.clientHeight<90;box.appendChild(d);if(near||cls==='me')box.scrollTop=box.scrollHeight}
function poll(){return rpc('webchat_poll',{p_widget:W,p_sid:SID,p_after:last}).then(function(rows){
(rows||[]).forEach(function(m){if(shown[m.id])return;shown[m.id]=1;if(m.id>last)last=m.id;add(m.direction==='in'?'me':'ag',m.text,hm(m.created_at))});
if(rows&&rows.length&&!ls('pcn_'+W))$('nm').classList.remove('on')}).catch(function(){})}
function loop(){poll().then(function(){timer=setTimeout(loop,document.hidden?15000:4000)})}
document.addEventListener('visibilitychange',function(){if(!document.hidden){if(timer)clearTimeout(timer);loop()}});

function fit(){var x=$('tx');x.style.height='auto';x.style.height=Math.min(x.scrollHeight,120)+'px'}
$('tx').addEventListener('input',fit);
$('tx').addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();$('f').requestSubmit?$('f').requestSubmit():$('f').dispatchEvent(new Event('submit',{cancelable:true}))}});
$('f').addEventListener('submit',function(e){e.preventDefault();var v=$('tx').value.trim();if(!v||busy)return;
var name=$('nm').classList.contains('on')?$('nm').value.trim():(ls('pcn_'+W)||'');
busy=true;$('go').disabled=true;$('err').textContent='';
rpc('webchat_send',{p_widget:W,p_sid:SID,p_name:name||null,p_text:v}).then(function(){
$('tx').value='';fit();if(name)ls('pcn_'+W,name);$('nm').classList.remove('on');busy=false;$('go').disabled=false;$('tx').focus();
if(timer)clearTimeout(timer);loop()}).catch(function(x){busy=false;$('go').disabled=false;var m=String(x&&x.message||'');
if(m.indexOf('rate_limited')>-1)$('err').textContent=t.rate;else if(m.indexOf('widget_unavailable')>-1)off(t.off);else $('err').textContent=t.fail})});

if(!/^[0-9a-f]{10,40}$/.test(W)){off(t.bad)}
else rpc('webchat_info',{p_widget:W}).then(function(r){var i=r&&r[0];if(!i)return off(t.off);
$('ttl').textContent=i.title||'Chat';document.title=i.title||'Chat';
if(!ls('pcn_'+W))$('nm').classList.add('on');
add('ag',i.welcome||'');loop()}).catch(function(){off(t.off)});
})();
</script>
</body>
</html>
